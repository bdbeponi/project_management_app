name: project_management
description: "A new Flutter project."
publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # flutter_localizations:
  #   sdk: flutter

  # 🎨 UI/UX & Design
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.1
  phone_form_field: ^10.0.10
  pin_input_text_field: ^4.5.2
  flutter_svg: ^2.2.0
  fl_chart: ^0.68.0

  # 🧠 State Management & DI
  provider: ^6.1.5+1
  rxdart: ^0.28.0
  get_it: ^8.2.0
  timeago: ^3.7.1

  # 🌐 Networking
  dio: ^5.9.0
  internet_connection_checker: ^3.0.1

  # 💾 Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # 🌍 Localization & Intl
  intl: ^0.20.2

  # 🧪 Utilities
  logger: ^2.6.1

  # 📍 Navigation
  go_router: ^16.2.0

  # (Optional Packages - Uncomment if needed)
  # 🎞️ Animations
  # lottie: ^3.3.1
  # dotlottie_loader: ^0.0.5
  # animated_list_plus: ^0.5.2

  # 📷 Media & Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  video_player: ^2.10.0 
  youtube_player_flutter: ^9.1.2
  just_audio: ^0.10.5
  syncfusion_flutter_pdfviewer: ^31.1.19
  share_plus: ^12.0.0

  # 📱 Input & Forms
  # pinput: ^5.0.1

  # 🔥 Firebase
  # firebase_core: ^3.12.1
  # firebase_auth: ^5.5.3
  # firebase_messaging: ^15.2.4

  # 🔔 Notifications
  # flutter_local_notifications: ^18.0.1

  # 🔒 Authentication
  # google_sign_in: ^6.3.0

  # 📱 Device Info
  # device_info_plus: ^11.3.3
  device_preview: ^1.3.1
  toastification: ^3.0.3
  flutter_image_compress: ^2.4.0
  google_nav_bar: ^5.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 🛠️ Code Generation
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_gen_runner: ^5.10.0

  # 🧪 Developer Tools
  dependency_validator: ^4.1.3
  # 🔧 Analyzer (ADD THIS TO FIX THE WARNING)
  analyzer: 



flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: false
    rive: false
    lottie: false
  colors:
    inputs:
      - assets/color/colors.xml
    outputs:
      class_name: AppColors

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/json/
    # - assets/lottie/
